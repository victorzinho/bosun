name: Release
run-name: Release ${{ inputs.release_type }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        options: [rc, stable]

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/python-uv-release.yml
    with:
      release_type: ${{ inputs.release_type }}
