[project]
name = "bosun"
version = "0.1.0rc2"
description = "Shared lifecycle recipes for my projects"
requires-python = ">=3.12"
# The recipes run src/bosun with the system python3: standard library only.
dependencies = []

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"

[tool.coverage.run]
source = ["bosun"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
